name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# macOS is NOT in this workflow. GitHub's macOS pools are sometimes short of runners, and a job that never starts
# ("not acquired by Runner") marked every push to main as failed even though everything that ran passed. macOS has its own
# workflow, macos.yml (pull requests, weekly, on demand), with one required check, "macOS result" (see macos.yml).
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  shells:
    # The README quick start under the shells people actually use (Linux usually bash; the macOS runs are in macos.yml).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install zsh
        if: matrix.shell == 'zsh' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm install
      - run: npm run build
      - name: Quick start under ${{ matrix.shell }}
        run: ${{ matrix.shell }} scripts/quickstart-smoke.sh
