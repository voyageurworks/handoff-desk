name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# macOS runs on both runner families: macos-latest is Apple silicon (arm64) and macos-15-intel is Intel (x86_64).
# GitHub's arm64 pool sometimes has no free capacity (jobs cancelled with "not acquired by Runner"); rerun them when that happens.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@10
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  shells:
    # The README quick start under the shells people actually use (macOS ships zsh; Linux usually bash).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
        shell: [bash, zsh]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install zsh
        if: matrix.shell == 'zsh' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm install
      - run: npm run build
      - name: Quick start under ${{ matrix.shell }}
        run: ${{ matrix.shell }} scripts/quickstart-smoke.sh
