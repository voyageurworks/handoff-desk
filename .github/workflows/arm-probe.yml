name: Apple-silicon probe

# Temporary and manual: which Apple-silicon runner labels get a runner right now. Removed after the test.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]
    steps:
      - run: uname -sm && sw_vers -productVersion
