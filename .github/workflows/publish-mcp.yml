name: Publish to MCP Registry

# Lists the version in server.json in the official MCP Registry (registry.modelcontextprotocol.io).
# Run it by hand, from main, after a release is on npm: Actions, Publish to MCP Registry, Run workflow.
# Uses GitHub OIDC (no stored token). The job waits for approval in the "mcp-registry" environment.
# The registry only accepts a version that is already on npm, and a published version cannot be changed.
on:
  workflow_dispatch:

# No permissions unless a job asks for them.
permissions: {}

jobs:
  publish:
    # A manual run uses the workflow file from the branch it is dispatched on: only main, only this repository.
    if: github.repository == 'voyageurworks/handoff-desk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    permissions:
      contents: read
      id-token: write
    env:
      # Update this deliberately to a reviewed release tag; never use a mutable "latest" download.
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry verifies the package against its metadata; check the same thing first so a mistake stops here.
      - name: server.json matches the package that is on npm
        run: |
          set -euo pipefail
          name="$(jq -r .name server.json)"
          version="$(jq -r .version server.json)"
          package="$(jq -r '.packages[0].identifier' server.json)"
          test "$(jq -r '.packages[0].version' server.json)" = "$version"
          test "$(npm view "$package@$version" mcpName)" = "$name"
          echo "server.json lists $name $version; npm has $package@$version with the same mcpName."
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Validate server.json
        run: ./mcp-publisher validate
      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
