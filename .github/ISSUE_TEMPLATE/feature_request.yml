name: Feature request
description: An idea or a missing piece.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Anything you tried instead?
